[package]
name = "vasak-connect-mobile"
version = "0.1.0"
description = "Compañero móvil de VasakOS: vincula el teléfono con el escritorio"
authors = ["Vasak Group", "Joaquin (Pato) Decima"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vasak_connect_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Para abrir la ventana compilada sin el servidor de desarrollo detrás.
#
# En depuración y sin esto, el WebView carga el `devUrl` de `tauri.conf.json`:
# si no hay nada sirviendo ahí, la ventana abre **vacía**, sin error, sin
# registro y sin nada que mirar. Es de los que cuestan media hora la primera vez
# que pasan.
#
# El nombre corto es el que documenta Tauri y el que usa el resto del
# escritorio, pero un rasgo de una dependencia no existe como rasgo propio hasta
# que el paquete lo reexporta: sin esta línea, `cargo build --features
# custom-protocol` responde «the package does not contain this feature». Lo
# calificado —`--features tauri/custom-protocol`— anda igual sin declarar nada,
# y es lo que el CLI de Tauri pasa por su cuenta al hacer `tauri build`; esto es
# para quien compila con cargo a mano.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Los plugins que viajan a móvil: el idioma de la sesión y la consola del
# sistema. El clic derecho (`vsk-contextual-menu`) y el diario de systemd
# (`vsk-journal`) se quedaron en el escritorio: en un teléfono no hay clic
# derecho ni journal, y sus crates no compilan para Android. El `gtk` de la
# plantilla estaba sólo para mover la ventana sin decoración, que tampoco existe.
tauri-plugin-i18n-vsk = "2.1.1"
tauri-plugin-shell = "2"

# El contrato de red y la lógica pura del canal, compartidos con el daemon del
# escritorio (`vasak-connect`). `default-features = false` deja afuera el contrato
# de D-Bus (`zbus`, que no compila en Android/iOS) y se lleva sólo `wire` y `pure`:
# el framing, el pinning del certificado, el compromiso y la derivación del SAS, y
# la máquina de estados del pareo. Las dos puntas corren la MISMA lógica; acá se
# reúsa, no se reimplementa.
vasak-connect-protocol = { version = "0.9", default-features = false }

# Descubrimiento de escritorios por mDNS (el daemon anuncia `_vasakconnect._tcp`).
# El parseo del registro TXT a `PeerInfo` lo hace `pure::parse_peer_txt`. El TLS y
# el DH del pareo llegan en el PR siguiente (PR2b), con sus propias dependencias.
mdns-sd = "0.13"

# Plugins sólo de escritorio, porque sus crates no compilan para Android:
#
#  - `tauri-plugin-vicons` arrastra `gtk` en todos los targets (confirmado con
#    `cargo tree -i gtk`: en Android es su única fuente), y en un teléfono no hay
#    tema de iconos freedesktop que resolver.
#  - `tauri-plugin-config-manager` 2.13 (la última) no compila para Android: usa
#    su módulo `desktop` sin condicionarlo por plataforma (bug upstream). En
#    móvil el esquema de color sale del piso de `main.css`, que ya son los
#    colores por omisión de VasakOS.
#
# shortcut: el fix de verdad es hacer estos dos plugins mobile-ready upstream;
# mientras tanto quedan sólo en escritorio (se registran condicional en `lib.rs`
# y sus permisos van en la capability `desktop`). La fuente de iconos y la config
# viva en móvil llegan en otro PR.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-vicons = "2"
tauri-plugin-config-manager = "2.13"

[dev-dependencies]
# Sólo para el test que valida los catálogos de idioma: el plugin los parsea en
# tiempo de ejecución y **paniquea** si no puede, así que un error de sintaxis no
# se ve hasta que la aplicación no arranca.
serde_yaml = "0.9"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1  # Deja que LLVM optimice mirando todo el programa a la vez.
lto = "thin"       # ~90% del beneficio de fat LTO, compilando mucho más rápido.
opt-level = 3      # Máxima optimización de velocidad.
panic = "abort"    # Sin desenrollado de pila: binario más chico y más rápido.
strip = true       # Fuera los símbolos de depuración.

# Ojo al empaquetar: makepkg inyecta `-flto` global en CFLAGS/LDFLAGS, y los
# crates que compilan C o assembly (ring, vía rustls) emiten bitcode que el
# enlazador de rustc no resuelve. El PKGBUILD tiene que llevar `options=('!lto')`
# — Cargo ya hace su propio LTO acá arriba, así que el de makepkg es redundante
# además de dañino.
