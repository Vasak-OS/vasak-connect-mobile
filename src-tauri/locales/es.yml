_version: 1
# Un catálogo por idioma, con las claves agrupadas por pantalla o componente.
#
# Dos reglas que aprendimos rompiendo cosas:
#
#  1. Si el valor contiene `: `, va **entre comillas**. Sin ellas el parser lo
#     lee como un mapeo anidado y rompe el archivo entero — y el plugin
#     paniquea al arrancar, así que la aplicación no abre.
#  2. Los dos idiomas tienen que tener las **mismas claves** y los mismos
#     marcadores `{0}`. Hay un test que lo verifica.
app:
  nombre: Vasak Connect
inicio:
  titulo: Vasak Connect
  descripcion: El compañero móvil de tu escritorio VasakOS. Vinculá el teléfono con tu equipo para empezar.
  estado:
    sinVincular: Sin vincular
    vinculado: Vinculado
  descubiertos:
    titulo: Escritorios en tu red
    buscando: Buscando escritorios de VasakOS…
    vincular: Vincular
    vinculado: Vinculado
  tipo:
    phone: Teléfono
    tablet: Tablet
    desktop: Escritorio
    unknown: Dispositivo
  sas:
    titulo: Confirmá el código
    conectando: Conectando con el escritorio…
    instruccion: Verificá que este código sea el mismo que aparece en el escritorio.
    aceptar: Coinciden
    rechazar: No coinciden
    cancelar: Cancelar
  resultado:
    paired: Escritorio vinculado.
    rejected_local: Rechazaste el código.
    rejected_peer: El escritorio rechazó el vínculo.
    aborted: El vínculo se interrumpió por seguridad. Probá de nuevo.
    cancelled: Se canceló el vínculo.
    error: No se pudo completar el vínculo.
